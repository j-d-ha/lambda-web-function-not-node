# Static configuration. The only setting this app computes at startup is the
# listen address, since AWS_LAMBDA_HTTP_ENDPOINT arrives as host:port; that one
# is set in JavaApiApplication.main().

# Tomcat runs each request on a virtual thread. A Web Function keeps many
# concurrent requests in one execution environment (64 by default, 128 at most),
# which is the case virtual threads exist for. This handler does no I/O, so the
# demo cannot show the win -- it is here because it is the right default for a
# servlet app on this platform.
spring.threads.virtual.enabled=true

# The name GET /health reports. Both builds come from this one source, so the
# name cannot be a string literal: the revision sets BACKEND_NAME in
# infra/lib/infra-stack.ts (java for the JVM build, java-aot for the native one),
# and this default is what a local `mvn spring-boot:run` gets.
app.backend=${BACKEND_NAME:java}
