# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!
  BUILD_DIR: build
  # Shared execve shim every non-Node backend zips in as index.js.
  NODE_WRAPPER: src/node-wrapper/index.js
  # Web Functions are arm64 only (Graviton).
  GOOS: linux
  GOARCH: arm64
  # Bundled CPython for the Python backend. python-build-standalone is a
  # relocatable arm64 build; "stripped" drops debug symbols and roughly halves
  # the size. Bump these two together to move Python versions.
  PYTHON_VERSION: 3.13.16
  PYTHON_MINOR: '3.13'
  PYTHON_BUILD_RELEASE: '20261013'
  PYTHON_PLATFORM: aarch64-unknown-linux-gnu
  PYTHON_RUNTIME_URL: https://github.com/astral-sh/python-build-standalone/releases/download/{{.PYTHON_BUILD_RELEASE}}/cpython-{{.PYTHON_VERSION}}%2B{{.PYTHON_BUILD_RELEASE}}-{{.PYTHON_PLATFORM}}-install_only_stripped.tar.gz
  # Staging dir the Python backend is assembled in before it is zipped.
  PY_STAGE: '{{.ROOT_DIR}}/{{.BUILD_DIR}}/python-api'
  PY_SITE: '{{.PY_STAGE}}/python/lib/python{{.PYTHON_MINOR}}/site-packages'
  PY_BIN: '{{.PY_STAGE}}/python/bin/python{{.PYTHON_MINOR}}'

tasks:
  format:
    desc: Format files in the repository
    cmd: format files $(git ls-files -co --exclude-standard)

  build:
    desc: Build every app artifact into build/
    deps:
      - build:node-api
      - build:go-api
      - build:dotnet-api
      - build:python-api

  build:node-api:
    desc: Bundle the Node API into build/node-api.zip
    dir: src/node-api
    cmds:
      - npm run build
      - mkdir -p '{{.ROOT_DIR}}/{{.BUILD_DIR}}'
      - rm -f '{{.ROOT_DIR}}/{{.BUILD_DIR}}/node-api.zip'
      - cd dist && zip -qr '{{.ROOT_DIR}}/{{.BUILD_DIR}}/node-api.zip' .

  build:go-api:
    desc: Cross-compile and bundle the Go API into build/go-api.zip
    dir: src/go-api
    cmds:
      # Build the binary into build/ and zip it flat with the shared wrapper, so
      # no staging copy of either is left in build/.
      - mkdir -p '{{.ROOT_DIR}}/{{.BUILD_DIR}}'
      - CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -trimpath -o '{{.ROOT_DIR}}/{{.BUILD_DIR}}/server' .
      - rm -f '{{.ROOT_DIR}}/{{.BUILD_DIR}}/go-api.zip'
      # zip -j jams paths, so the wrapper lands in the zip root as index.js.
      - zip -jq '{{.ROOT_DIR}}/{{.BUILD_DIR}}/go-api.zip' '{{.ROOT_DIR}}/{{.NODE_WRAPPER}}' '{{.ROOT_DIR}}/{{.BUILD_DIR}}/server'
      - rm -f '{{.ROOT_DIR}}/{{.BUILD_DIR}}/server'

  build:dotnet-api:
    desc: Publish the ASP.NET NativeAOT API and bundle it into build/dotnet-api.zip
    cmds:
      # NativeAOT can't link a linux-arm64 binary on macOS (no Linux sysroot),
      # so the publish runs in a linux/arm64 SDK container. AssemblyName=server
      # so the native binary matches the wrapper's contract.
      - rm -rf '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api'
      - mkdir -p '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api'
      - docker build -q -t dotnet-api-aot -f '{{.ROOT_DIR}}/src/DotnetApiAot/Dockerfile.aot' '{{.ROOT_DIR}}/src/DotnetApiAot'
      - docker run --rm --platform linux/arm64 -u "$(id -u):$(id -g)" -e HOME=/tmp -v '{{.ROOT_DIR}}:/work' -w /work dotnet-api-aot dotnet publish src/DotnetApiAot/DotnetApiAot.csproj -c Release -r {{.GOOS}}-{{.GOARCH}} -p:AssemblyName=server -o build/dotnet-api --nologo
      - rm -f '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api.zip'
      - zip -jq '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api.zip' '{{.ROOT_DIR}}/{{.NODE_WRAPPER}}' '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api/server' '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api/appsettings.json'
      - rm -rf '{{.ROOT_DIR}}/{{.BUILD_DIR}}/dotnet-api'

  build:python-api:
    desc: Bundle FastAPI with a bundled CPython + deps into build/python-api.zip
    dir: src/python-api
    cmds:
      # Web Functions ship no Python, so unlike Go and .NET (single static
      # binary) this zip carries the whole interpreter next to the code.
      - rm -rf '{{.PY_STAGE}}'
      - mkdir -p '{{.PY_STAGE}}'
      # 1. Relocatable arm64 CPython, extracted as python/ in the zip root.
      - curl -fsSL -o '{{.PY_STAGE}}/python.tar.gz' '{{.PYTHON_RUNTIME_URL}}'
      - tar -xzf '{{.PY_STAGE}}/python.tar.gz' -C '{{.PY_STAGE}}'
      - rm -f '{{.PY_STAGE}}/python.tar.gz'
      # 2. Trim what an HTTP server never imports: C headers, man/terminfo
      #    data, tk/idle/ensurepip, the bundled pip, and the duplicate
      #    bin/* symlinks (the shebang calls python3.13 by full path).
      - rm -rf '{{.PY_STAGE}}/python/include' '{{.PY_STAGE}}/python/share'
      - rm -rf '{{.PY_STAGE}}/python/lib/python{{.PYTHON_MINOR}}/ensurepip' '{{.PY_STAGE}}/python/lib/python{{.PYTHON_MINOR}}/idlelib' '{{.PY_STAGE}}/python/lib/python{{.PYTHON_MINOR}}/tkinter'
      - rm -rf '{{.PY_SITE}}/pip' '{{.PY_SITE}}/pip-'*.dist-info
      - find '{{.PY_STAGE}}/python/bin' -maxdepth 1 -type l -delete
      # 3. Dependencies resolved for the target platform, not this host, so the
      #    compiled wheels (pydantic-core) are linux/arm64.
      - uv pip install --quiet --target '{{.PY_SITE}}' --python-platform '{{.PYTHON_PLATFORM}}' --python-version '{{.PYTHON_MINOR}}' --only-binary ':all:' -r requirements.txt
      - cp '{{.ROOT_DIR}}/{{.NODE_WRAPPER}}' '{{.PY_STAGE}}/index.js'
      # 4. Zip root: the shim, the launcher, and the runtime. The launcher is
      #    main.py with an interpreter shebang, so execve runs the bundled
      #    Python on it. -X drops macOS quirk entries (__MACOSX, xattrs).
      - '{ printf "#!/var/task/python/bin/python{{.PYTHON_MINOR}}\n"; cat main.py; } > "{{.PY_STAGE}}/server"'
      - chmod +x '{{.PY_STAGE}}/server' '{{.PY_BIN}}'
      - rm -f '{{.ROOT_DIR}}/{{.BUILD_DIR}}/python-api.zip'
      - cd '{{.PY_STAGE}}' && zip -Xqr '{{.ROOT_DIR}}/{{.BUILD_DIR}}/python-api.zip' .
      - rm -rf '{{.PY_STAGE}}'

  deploy:
    desc: Deploy the CDK stack (builds artifacts first). Extra args via `task deploy -- ...`
    dir: infra
    deps:
      - build
    cmds:
      - npx cdk deploy {{.CLI_ARGS}}
